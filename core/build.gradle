[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "io.github.libktx:ktx-actors:$ktxVersion"
  api "io.github.libktx:ktx-app:$ktxVersion"
  api "io.github.libktx:ktx-assets:$ktxVersion"
  api "io.github.libktx:ktx-collections:$ktxVersion"
  api "io.github.libktx:ktx-graphics:$ktxVersion"
  api "io.github.libktx:ktx-i18n:$ktxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlinVersion"
}

def generatedAssetCatalogDir = layout.buildDirectory.dir("generated/source/assetCatalog/kotlin")

sourceSets {
  main {
    kotlin.srcDir(generatedAssetCatalogDir)
  }
}

tasks.register("generateAssetCatalog", JavaExec) {
  dependsOn(rootProject.tasks.named("prepareAssets"))
  dependsOn(":tools:asset-catalog-generator:classes")

  inputs.dir(rootProject.file("assets"))
  inputs.file(rootProject.file("assets/textures/textures.atlas"))
  outputs.dir(generatedAssetCatalogDir)

  classpath = project(":tools:asset-catalog-generator").sourceSets.main.runtimeClasspath
  mainClass.set("fr.mwet.tools.assetcataloggenerator.MainKt")

  args(
    "--input", rootProject.file("assets").absolutePath,
    "--output", generatedAssetCatalogDir.get().asFile.absolutePath,
    "--package", "fr.mwet.snake.generated.assets",
  )
}

tasks.named("compileKotlin") {
  dependsOn("generateAssetCatalog")
}

tasks.named("test") {
  inputs.dir(rootProject.file("sourceAssets/i18n"))
}
