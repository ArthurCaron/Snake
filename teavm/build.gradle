plugins {
  id 'java'
  id 'org.gretty' version "3.1.5"
}

gretty {
  contextPath = '/'
  extraResourceBase 'build/dist/webapp'
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

tasks.named('processResources') {
  dependsOn(rootProject.tasks.named('prepareAssets'))
}
project.ext.mainClassName = "fr.mwet.snake.teavm.TeaVMBuilder"
eclipse.project.name = appName + "-teavm"

// This must be at least 11, and no higher than the JDK version this project is built with.
java.targetCompatibility = "21"
// This should probably be equal to targetCompatibility, above. This only affects the TeaVM module.
java.sourceCompatibility = "21"


dependencies {
  implementation "com.github.xpenatan.gdx-teavm:backend-teavm:$gdxTeaVMVersion"
  implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
  implementation "org.teavm:teavm-classlib:$teaVMVersion"
  implementation "org.teavm:teavm-core:$teaVMVersion"
  implementation "org.teavm:teavm-jso-apis:$teaVMVersion"
  implementation "org.teavm:teavm-jso-impl:$teaVMVersion"
  implementation "org.teavm:teavm-jso:$teaVMVersion"
  implementation "org.teavm:teavm-tooling:$teaVMVersion"
  implementation project(':core')

}


tasks.register("cleanTeaVMWebapp", Delete) {
  delete file("build/dist")
}

tasks.register("buildJavaScript", JavaExec) {
  dependsOn classes, cleanTeaVMWebapp
  setDescription("Transpile bytecode to JavaScript via TeaVM")
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)

  doLast {
    copy {
      from(rootProject.file("sourceAssets/web/favicon.ico"))
      into(layout.buildDirectory.dir("dist/webapp"))
    }

    // The gdx-teavm index.html has no viewport meta tag: phones render it 980 px wide and zoom on double tap.
    File indexFile = layout.buildDirectory.file("dist/webapp/index.html").get().asFile
    String index = indexFile.text
    if (!index.contains('<head>') || !index.contains('</style>')) {
      throw new GradleException("index.html changed in gdx-teavm: add the mobile viewport and touch-action by hand")
    }
    indexFile.text = index
      .replace('<head>', '<head>\n    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">')
      .replace('</style>', '    canvas { touch-action: none; }\n    </style>')
  }
}

def stopStaleTeaVMServer = tasks.register("stopStaleTeaVMServer", Exec) {
  group = "application"
  description = "Stop a stale Gretty server listening on the TeaVM development port"
  onlyIf { System.getProperty("os.name").startsWith("Windows") }
  commandLine(
    "powershell.exe",
    "-NoProfile",
    "-NonInteractive",
    "-ExecutionPolicy", "Bypass",
    "-File", file("stop-server.ps1").absolutePath,
    "-Port", "8080",
  )
}

tasks.matching { it.name == "jettyRun" }.configureEach {
  dependsOn(stopStaleTeaVMServer)
}

build.dependsOn buildJavaScript

tasks.register("run") {
  description = "Run the JavaScript application hosted via a local Jetty server at http://localhost:8080/"
  dependsOn(buildJavaScript, tasks.named("jettyRun"))
}

tasks.register("webZip", Zip) {
  group = "distribution"
  description = "Zip the web build, ready for itch.io or any static host"
  dependsOn(buildJavaScript)
  from(layout.buildDirectory.dir("dist/webapp")) {
    exclude("WEB-INF/**")
  }
  archiveFileName = "${appName}-web.zip"
  destinationDirectory = layout.buildDirectory.dir("dist")
}
